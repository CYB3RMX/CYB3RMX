<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYB3RMX Terminal</title>
<meta name="description" content="Interactive terminal for CYB3RMX: type help to get started.">
<style>
  :root{
    --bg:#0D1117; --panel:#010409; --line:#30363D; --text:#C9D1D9; --dim:#6E7681;
    --accent:#00FF99; --warn:#F2CC60; --err:#FF7B72; --link:#58A6FF;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.55 'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .win{
    width:100%; max-width:1280px; height:min(860px,100%); display:flex; flex-direction:column;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .bar{display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--bg); border-bottom:1px solid var(--line); flex:none}
  .dot{width:12px;height:12px;border-radius:50%}
  .dot:nth-child(1){background:#FF5F56}.dot:nth-child(2){background:#FFBD2E}.dot:nth-child(3){background:#27C93F}
  .title{margin-left:8px;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #screen{flex:1; overflow-y:auto; padding:14px 16px; cursor:text; scrollbar-color:var(--line) transparent}
  #out{white-space:pre-wrap; word-break:break-word}
  .row{display:flex; align-items:baseline; gap:0}
  .ps1{color:var(--accent); white-space:pre; flex:none}
  .ps1 .path{color:var(--link)}
  #in{
    flex:1; min-width:0; background:transparent; border:0; outline:0; color:#fff; font:inherit;
    caret-color:var(--accent); padding:0;
  }
  a{color:var(--link); text-decoration:none} a:hover{text-decoration:underline}
  .acc{color:var(--accent)} .dim{color:var(--dim)} .err{color:var(--err)} .warn{color:var(--warn)} .b{font-weight:700}
  .cmd{color:var(--accent);display:inline-block;min-width:11ch}
  .dir{color:var(--link);font-weight:700}
  pre{margin:0;font:inherit;white-space:pre}
  .ghost{color:var(--accent);line-height:1;display:inline-block;animation:bob 2.4s ease-in-out infinite}
  .ghost .e{color:#fff}.ghost .p{color:#010409}
  @keyframes bob{50%{transform:translateY(-4px)}}
  .fetch{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  .fetch>pre:not(.ghost){white-space:pre-wrap;min-width:0;max-width:100%}
  .bar-l{color:var(--accent)}
  @media (max-width:560px){ body{padding:0} .win{border-radius:0;height:100%;border:0} #screen{font-size:14px} }
  @media (prefers-reduced-motion:reduce){ .ghost{animation:none} }
  [data-theme=amber]{--accent:#FFB000} [data-theme=ice]{--accent:#7DD3FC} [data-theme=mono]{--accent:#E6EDF3}
</style>
</head>
<body>
<div class="win" role="application" aria-label="CYB3RMX interactive terminal">
  <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="title">CYB3RMX@github: ~</span></div>
  <div id="screen">
    <div id="out" aria-live="polite"></div>
    <div class="row"><span class="ps1" id="ps1"></span><input id="in" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="terminal input" autofocus></div>
  </div>
</div>

<script>
(() => {
  const USER = 'CYB3RMX';
  const $ = id => document.getElementById(id);
  const out = $('out'), input = $('in'), screen = $('screen'), ps1 = $('ps1');

  const projects = {
    'Qu1cksc0pe':    {lang:'YARA',   desc:'All-in-One malware analysis tool.'},
    'MalwareHashDB': {lang:'-',      desc:'Malware hashes for open source projects.'},
    'd00r':          {lang:'Python', desc:'Simple directory brute-force tool written with Python.'},
    'Wh1teM0cha':    {lang:'Python', desc:'Mach-O parser & reverse engineering module.'},
    'BlackHeart':    {lang:'Python', desc:'PowerShell reverse shell script generator.'}
  };
  const about = [
    'Interested in malware analysis, malware detection and penetration testing.',
    'Security utils/tools developer.',
    'Linux system administrator.'
  ];

  // ---- helpers -----------------------------------------------------------
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const a = (url, text) => `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(text || url)}</a>`;
  const print = (html = '') => { out.insertAdjacentHTML('beforeend', html + '\n'); screen.scrollTop = screen.scrollHeight; };
  const api = path => fetch('https://api.github.com' + path).then(x => { if (!x.ok) throw new Error(x.status); return x.json(); });
  let reposP = null;                       // one shared request for `status` and `projects`
  const getRepos = () => reposP || (reposP = api(`/users/${USER}/repos?per_page=100&sort=pushed`).catch(e => { reposP = null; throw e; }));
  const ago = d => { const days = Math.floor((Date.now() - new Date(d)) / 864e5);
    return days < 1 ? 'today' : days < 31 ? days + 'd ago' : days < 365 ? Math.floor(days / 30) + 'mo ago' : (days / 365).toFixed(1).replace('.0', '') + 'y ago'; };
  const fmt = n => n >= 1000 ? (n / 1000).toFixed(1).replace('.0', '') + 'k' : String(n);
  const promptHTML = () => 'user@github:<span class="path">~</span>$ ';
  const setPrompt = () => { ps1.innerHTML = promptHTML(); };
  const ghostArt = [
    '   ▄██████▄   ',
    ' ▄██████████▄ ',
    '███<span class="e">█</span><span class="p">█</span>████<span class="e">█</span><span class="p">█</span>███',
    '███<span class="e">█</span><span class="p">█</span>████<span class="e">█</span><span class="p">█</span>███',
    '██████████████',
    '██████████████',
    '██▀▀██▀▀██▀▀██'
  ];
  const ghost = () => `<pre class="ghost" aria-hidden="true">${ghostArt.join('\n')}</pre>`;

  // ---- commands ----------------------------------------------------------
  const cmds = {
    help: { d: 'list available commands', run() {
      const rows = Object.entries(cmds).filter(([, c]) => !c.hidden).map(([n, c]) => `  <span class="cmd">${n}</span><span class="dim">${esc(c.d)}</span>`);
      print('<span class="b">Available commands</span>\n' + rows.join('\n') + '\n\n<span class="dim">Tip: Tab completes, ↑/↓ browse history, Ctrl+L clears.</span>');
    }},
    open: { d: 'open a project repo in a new tab', run(args) {
      const q = (args[0] || '').replace(/\/$/, '').toLowerCase();
      if (!q) return print('usage: open &lt;project&gt;   e.g. open qu1cksc0pe');
      const name = Object.keys(projects).find(p => p.toLowerCase() === q) || (q === 'profile' || q === 'github' ? '' : null);
      if (name === null) return print(`<span class="err">open: unknown project '${esc(args[0])}'</span> <span class="dim">(see: projects)</span>`);
      const url = 'https://github.com/' + USER + (name ? '/' + name : '');
      print('Opening ' + a(url) + ' ...');
      window.open(url, '_blank', 'noopener');
    }},
    projects: { d: 'my projects with live stats (projects <name> for details)', async: true, async run(args) {
      const q = (args[0] || '').toLowerCase();
      const name = q && Object.keys(projects).find(k => k.toLowerCase() === q);
      if (q && !name) return print(`<span class="err">projects: unknown project '${esc(args[0])}'</span> <span class="dim">(see: projects)</span>`);
      print('<span class="dim">Fetching live data from api.github.com ...</span>');
      let repos = null;
      try { repos = await getRepos(); } catch (e) { print(`<span class="warn">GitHub API unavailable (${esc(e.message)}), showing saved info.</span>`); }
      const live = n => repos && repos.find(r => r.name === n);

      if (!name) {                                           // ---- list view
        const rows = Object.entries(projects).map(([n, p]) => {
          const r = live(n);
          const stats = r ? `<span class="warn">★ ${fmt(r.stargazers_count).padEnd(5)}</span> <span class="dim">⑂ ${fmt(r.forks_count).padEnd(4)} ${ago(r.pushed_at).padEnd(8)}</span>` : '';
          const d = p.desc;
          return `  <span class="dir">${esc(n.padEnd(14))}</span> <span class="dim">${esc(((r && r.language) || p.lang).padEnd(7))}</span> ${stats} ${esc(d.length > 42 ? d.slice(0, 39) + '...' : d)}`;
        });
        const stars = repos ? Object.keys(projects).reduce((t, n) => t + (live(n) ? live(n).stargazers_count : 0), 0) : null;
        return print(rows.join('\n') + (stars !== null ? `\n\n<span class="dim">${Object.keys(projects).length} projects ·</span> <span class="warn">★ ${stars}</span> <span class="dim">stars in total</span>` : '') +
          '\n<span class="dim">projects &lt;name&gt; for details, open &lt;name&gt; to visit.</span>');
      }

      // ---- detail view
      const p = projects[name], r = live(name), row = (k, v) => `<span class="dim">${k.padEnd(12)}</span>${v}`;
      const lines = [`<span class="acc b"># ${esc(name)}</span>`, esc((r && r.description) || p.desc), ''];
      if (r) {
        let langs = {};
        try { langs = await api(`/repos/${USER}/${name}/languages`); } catch (_) {}
        const total = Object.values(langs).reduce((t, n) => t + n, 0);
        lines.push(row('stars', `<span class="warn">★ ${r.stargazers_count}</span>`), row('forks', r.forks_count),
          row('watchers', r.subscribers_count !== undefined ? r.subscribers_count : r.watchers_count), row('open issues', r.open_issues_count),
          row('license', esc(r.license ? r.license.spdx_id || r.license.name : 'none')),
          row('created', new Date(r.created_at).toISOString().slice(0, 10)),
          row('last push', `${new Date(r.pushed_at).toISOString().slice(0, 10)} <span class="dim">(${ago(r.pushed_at)})</span>`),
          row('size', r.size >= 1024 ? (r.size / 1024).toFixed(1) + ' MB' : r.size + ' KB'));
        if (r.topics && r.topics.length) lines.push(row('topics', r.topics.map(esc).join(', ')));
        if (r.homepage) lines.push(row('homepage', a(r.homepage)));
        if (total) {
          lines.push('', '<span class="b">Languages</span>');
          Object.entries(langs).sort((x, y) => y[1] - x[1]).slice(0, 5).forEach(([l, n]) => {
            const pct = n / total * 100;
            lines.push(`  ${esc(l.padEnd(12))}<span class="bar-l">${'█'.repeat(Math.max(1, Math.round(pct / 5)))}</span> <span class="dim">${pct.toFixed(1)}%</span>`);
          });
        }
      } else {
        lines.push(row('language', esc(p.lang)));
      }
      lines.push('', row('repo', a('https://github.com/' + USER + '/' + name)), '', `<span class="dim">Run</span> open ${esc(name)} <span class="dim">to visit it.</span>`);
      print(lines.join('\n'));
    }},
    whoami: { d: 'who am I?', run() {
      const info = [`<span class="acc b">${USER}</span><span class="dim">@github</span>`, '<span class="dim">--------------</span>',
        ...about.map(l => '• ' + esc(l))];
      print(`<div class="fetch">${ghost()}<pre>${info.join('\n')}</pre></div>`);
    }},
    status: { d: 'live GitHub stats (fetched from the API)', async: true, async run() {
      print('<span class="dim">Fetching live data from api.github.com ...</span>');
      try {
        const [u, r] = await Promise.all([
          fetch(`https://api.github.com/users/${USER}`).then(x => { if (!x.ok) throw new Error(x.status); return x.json(); }),
          getRepos()
        ]);
        const own = r.filter(x => !x.fork), stars = own.reduce((s, x) => s + x.stargazers_count, 0);
        const langs = {}; own.forEach(x => x.language && (langs[x.language] = (langs[x.language] || 0) + 1));
        const top = Object.entries(langs).sort((p, q) => q[1] - p[1]).slice(0, 5), max = top.length ? top[0][1] : 1;
        const best = [...own].sort((p, q) => q.stargazers_count - p.stargazers_count)[0];
        const since = new Date(u.created_at).getFullYear();
        const row = (k, v) => `<span class="dim">${k.padEnd(14)}</span>${v}`;
        print([
          `<span class="b acc">${esc(u.login)}</span> <span class="dim">· member since ${since}</span>`,
          row('followers', u.followers), row('public repos', `${u.public_repos} <span class="dim">(${own.length} original)</span>`),
          row('total stars', `★ ${stars}`),
          best ? row('top repo', `${a(best.html_url, best.name)} <span class="dim">★ ${best.stargazers_count}</span>`) : '',
          row('last push', r[0] ? `${esc(r[0].name)} <span class="dim">${new Date(r[0].pushed_at).toISOString().slice(0, 10)}</span>` : '-'),
          '', '<span class="b">Top languages</span> <span class="dim">(by repo count)</span>',
          ...top.map(([l, n]) => `  ${esc(l.padEnd(12))}<span class="bar-l">${'█'.repeat(Math.max(1, Math.round(n / max * 20)))}</span> <span class="dim">${n}</span>`)
        ].filter(x => x !== '').join('\n'));
      } catch (e) {
        print(`<span class="err">Could not reach the GitHub API (${esc(e.message)}).</span>\n<span class="dim">It may be rate limited. Try again later or visit</span> ${a('https://github.com/' + USER)}`);
      }
    }},
    links: { d: 'where to find me', run() { print('GitHub   ' + a('https://github.com/' + USER)); }},
    echo: { d: 'print text', run(args, raw) { print(esc(raw.replace(/^echo\s*/, ''))); }},
    date: { d: 'current date and time', run() { print(new Date().toString()); }},
    history: { d: 'show command history', run() { print(hist.map((h, i) => `  ${String(i + 1).padStart(3)}  ${esc(h)}`).join('\n')); }},
    theme: { d: 'change colour: green | amber | ice | mono', run(args) {
      const t = (args[0] || '').toLowerCase(), ok = { green: '', amber: 'amber', ice: 'ice', mono: 'mono' };
      if (!(t in ok)) return print('usage: theme &lt;green|amber|ice|mono&gt;');
      if (ok[t]) document.documentElement.dataset.theme = ok[t]; else delete document.documentElement.dataset.theme;
      try { localStorage.setItem('term-theme', ok[t]); } catch (_) {}
      print(`Theme set to <span class="acc">${t}</span>.`);
    }},
    clear: { d: 'clear the screen (Ctrl+L)', run() { out.innerHTML = ''; }},
    sudo: { hidden: true, d: '', run() { print(`<span class="err">${USER} is not in the sudoers file. This incident will be reported.</span> <span class="dim">(to nobody)</span>`); }},
    rm: { hidden: true, d: '', run(args) { print(args.join(' ').includes('-rf') ? '<span class="warn">Nice try. Everything here is read-only. 👻</span>' : '<span class="err">rm: permission denied</span>'); }},
    exit: { hidden: true, d: '', run() { print('<span class="dim">There is no escape. Try</span> open github'); }},
    ghost: { hidden: true, d: '', run() { print(ghost() + '\n<span class="acc">Boo!</span>'); }}
  };
  cmds.neofetch = { hidden: true, d: '', run: a => cmds.whoami.run(a) };

  // ---- input handling ----------------------------------------------------
  const hist = []; let hi = 0, busy = false;

  async function exec(line) {
    print(`<span class="ps1">${promptHTML()}</span>${esc(line)}`);
    const raw = line.trim(); if (!raw) return;
    hist.push(raw); hi = hist.length;
    const [name, ...args] = raw.split(/\s+/), c = cmds[name.toLowerCase()];
    if (!c) return print(`<span class="err">${esc(name)}: command not found.</span> <span class="dim">Type</span> help`);
    busy = true;
    try { await c.run(args, raw); } finally { busy = false; }
  }

  function complete() {
    const v = input.value, parts = v.split(/\s+/);
    if (parts.length === 1) {
      const m = Object.keys(cmds).filter(k => !cmds[k].hidden && k.startsWith(parts[0].toLowerCase()));
      if (m.length === 1) input.value = m[0] + ' '; else if (m.length > 1) print(esc(v) + '\n' + m.join('  '));
    } else if (['open', 'projects'].includes(parts[0].toLowerCase()) && parts.length === 2) {
      const m = Object.keys(projects).filter(k => k.toLowerCase().startsWith(parts[1].toLowerCase()));
      if (m.length === 1) input.value = parts[0] + ' ' + m[0];
      else if (m.length > 1) print(esc(v) + '\n' + m.join('  '));
    }
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { if (busy) return; const l = input.value; input.value = ''; exec(l); }
    else if (e.key === 'Tab') { e.preventDefault(); complete(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (hi > 0) input.value = hist[--hi]; }
    else if (e.key === 'ArrowDown') { e.preventDefault(); input.value = hi < hist.length - 1 ? hist[++hi] : (hi = hist.length, ''); }
    else if (e.ctrlKey && e.key.toLowerCase() === 'l') { e.preventDefault(); out.innerHTML = ''; }
    else if (e.ctrlKey && e.key.toLowerCase() === 'c') { e.preventDefault(); print(`<span class="ps1">${promptHTML()}</span>${esc(input.value)}^C`); input.value = ''; }
  });
  screen.addEventListener('click', () => { if (!getSelection().toString()) input.focus(); });

  // ---- boot --------------------------------------------------------------
  try { const t = localStorage.getItem('term-theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
  setPrompt();
  print(`<div class="fetch">${ghost()}<pre>\n<span class="acc b">${USER}</span><span class="dim">@github</span>\nWelcome to my terminal.\nType <span class="acc">help</span> to see what you can do,\nor try <span class="acc">status</span>, <span class="acc">projects</span>, <span class="acc">whoami</span>.</pre></div>\n`);
  input.focus();

  // Deep link: ?cmd=projects or ?cmd=whoami,status runs those commands on load (used by the README buttons).
  (async () => {
    const wanted = (new URLSearchParams(location.search).get('cmd') || '').split(',').map(c => c.trim().toLowerCase()).filter(Boolean).slice(0, 4);
    for (const c of wanted) if (cmds[c] && !cmds[c].hidden && c !== 'open') await exec(c);
  })();
})();
</script>
</body>
</html>
